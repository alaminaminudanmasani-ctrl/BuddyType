<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuddyType - Fun Kids Typing!</title>
    <style>
        :root {
            --bg-color: #eef2f3;
            --box-bg: #ffffff;
            --text-default: #94a3b8;
            --text-correct: #10b981; /* Happy Green */
            --text-incorrect: #f43f5e; /* Oops Red */
            --fun-purple: #8b5cf6;
        }
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; background: var(--bg-color); color: #334155; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .game-card { background: var(--box-bg); padding: 40px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.06); max-width: 600px; width: 90%; text-align: center; border: 4px solid #ddd6fe; }
        h1 { color: var(--fun-purple); margin-top: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; }
        .stats-bar { display: flex; justify-content: space-around; font-size: 1.4rem; font-weight: bold; margin-bottom: 25px; background: #f5f3ff; padding: 15px; border-radius: 20px; color: #4c1d95; }
        .typing-area { font-size: 2rem; line-height: 1.6; letter-spacing: 1px; word-spacing: 6px; min-height: 100px; margin-bottom: 20px; outline: none; user-select: none; cursor: pointer; }
        .letter { position: relative; }
        .letter.correct { color: var(--text-correct); font-weight: bold; }
        .letter.incorrect { color: var(--text-incorrect); background: #ffe4e6; border-radius: 4px; }
        .hidden-input { position: absolute; opacity: 0; pointer-events: none; }
        .btn-restart { background: var(--fun-purple); color: white; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 8px 0 #6d28d9; transition: all 0.1s; }
        .btn-restart:active { transform: translateY(4px); box-shadow: 0 4px 0 #6d28d9; }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🎈 BuddyType! 🚀</h1>
        
        <div class="stats-bar">
            <div id="wpmDisplay">🚀 Speed: 0</div>
            <div id="accuracyDisplay">🎯 Score: 100%</div>
            <div id="timerDisplay">⏰ Time: 30s</div>
        </div>

        <input type="text" id="typingInput" class="hidden-input" autocomplete="off" autofocus>
        
        <div class="typing-area" id="textTarget" onclick="focusInput()">
            <!-- Kid words arrive here -->
        </div>

        <button class="btn-restart" onclick="resetTest()">🎮 Play Again!</button>
    </div>

    <script>
        // Fun, easy, simple words for kids
        const kidWords = ["cat", "dog", "sun", "play", "game", "happy", "blue", "red", "green", "frog", "jump", "star", "ball", "book", "cake", "fish", "tree", "bird", "lion", "milk", "apple", "smile", "kite", "ship", "duck"];
        let targetText = "";
        let charIndex = 0, mistakes = 0, timer = 30, isTracking = false, intervalId = null;

        const textTarget = document.getElementById('textTarget');
        const typingInput = document.getElementById('typingInput');
        const timerDisplay = document.getElementById('timerDisplay');
        const wpmDisplay = document.getElementById('wpmDisplay');
        const accuracyDisplay = document.getElementById('accuracyDisplay');

        function generateWords() {
            let shuffled = [...kidWords].sort(() => Math.random() - 0.5);
            targetText = shuffled.slice(0, 10).join(" ");
            textTarget.innerHTML = "";
            for (let char of targetText) {
                let span = document.createElement('span');
                span.className = "letter";
                span.textContent = char;
                textTarget.appendChild(span);
            }
            charIndex = 0; mistakes = 0; timer = 30; isTracking = false;
            clearInterval(intervalId);
            timerDisplay.textContent = "⏰ Time: 30s";
            wpmDisplay.textContent = "🚀 Speed: 0";
            accuracyDisplay.textContent = "🎯 Score: 100%";
            typingInput.value = "";
        }

        function focusInput() { typingInput.focus(); }

        typingInput.addEventListener('input', (e) => {
            let letters = textTarget.querySelectorAll('.letter');
            let typedVal = typingInput.value;
            
            if (!isTracking && typedVal.length > 0) {
                isTracking = true;
                intervalId = setInterval(startTimer, 1000);
            }

            charIndex = typedVal.length - 1;
            if (charIndex >= letters.length) return;

            if (e.inputType === "deleteContentBackward") {
                letters[charIndex + 1].className = "letter";
                return;
            }

            let currentLetter = letters[charIndex];
            if (typedVal[charIndex] === currentLetter.textContent) {
                currentLetter.className = "letter correct";
            } else {
                currentLetter.className = "letter incorrect";
                mistakes++;
            }

            if (typedVal.length === letters.length) {
                endTest();
            }
        });

        function startTimer() {
            if (timer > 0) {
                timer--;
                timerDisplay.textContent = `⏰ Time: ${timer}s`;
                let wordsTyped = typingInput.value.length / 5;
                let minutesPassed = (30 - timer) / 60;
                let liveWpm = Math.round(wordsTyped / minutesPassed) || 0;
                wpmDisplay.textContent = `🚀 Speed: ${liveWpm}`;
            } else {
                endTest();
            }
        }

        function endTest() {
            clearInterval(intervalId);
            typingInput.blur();
            let totalChars = typingInput.value.length;
            let correctChars = totalChars - mistakes;
            let accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
            let finalWpm = Math.round((totalChars / 5) / (30 / 60)) || 0;

            wpmDisplay.textContent = `🏆 Final Speed: ${finalWpm}`;
            accuracyDisplay.textContent = `🎯 Accuracy: ${accuracy}%`;
            timerDisplay.textContent = "🎉 STAR!";
        }

        function resetTest() { generateWords(); focusInput(); }

        generateWords();
        window.addEventListener('load', focusInput);
    </script>
</body>
</html>
